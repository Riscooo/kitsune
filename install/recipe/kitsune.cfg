// Kitsune — configuración propia del motor (autoconfig ignora esta primera línea).
//
// Modos de privacidad por perfil: «estricto» (predeterminado) y «comodo».
// El lanzador pasa el modo del perfil en KITSUNE_PRIVACY_MODE; un valor ausente
// o desconocido aplica Estricto.
//
// Gecko lee prefs.js y user.js antes de este archivo, así que aquí se ven los
// valores guardados del perfil. Los valores de cada modo son valores por
// defecto: lo que el usuario cambie a mano se respeta. Solo al cambiar de modo
// se limpian una vez los ajustes gestionados, para que no queden restos del
// anterior. Un perfil anterior a 0.6 que abre en Estricto no pierde nada.
//
// Los conjuntos de abajo los genera tools/privacy_modes.py a partir de las
// mediciones de tests/fixtures/; no se editan a mano.

const KITSUNE_MODES = ["estricto", "comodo"];
let kitsuneMode = "estricto";
try {
  const requested = getenv("KITSUNE_PRIVACY_MODE");
  if (KITSUNE_MODES.includes(requested)) kitsuneMode = requested;
} catch (error) {}

// @@KITSUNE_GENERATED_BEGIN@@
const KITSUNE_COMMON = {};
const KITSUNE_MODE_PREFS = {};
// @@KITSUNE_GENERATED_END@@

for (const [name, value] of Object.entries(KITSUNE_COMMON)) defaultPref(name, value);

// getPref devuelve null si el perfil aún no tiene modo (perfil nuevo o anterior a 0.6).
const kitsuneApplied = getPref("kitsune.privacy.applied") ?? null;
const kitsuneSwitched = kitsuneApplied !== kitsuneMode &&
  !(kitsuneApplied === null && kitsuneMode === "estricto");
for (const [name, values] of Object.entries(KITSUNE_MODE_PREFS)) {
  if (kitsuneSwitched) clearPref(name);
  const value = values[kitsuneMode === "comodo" ? 1 : 0];
  if (value !== null) defaultPref(name, value);
}
if (kitsuneApplied !== kitsuneMode) pref("kitsune.privacy.applied", kitsuneMode);
defaultPref("kitsune.privacy.active", kitsuneMode);
